name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Un PR nuevo cancela el anterior; en main no se cancela para no perder el build de un commit.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/setup
        with: { wails: "true" }
      - run: go vet ./...
      - run: go test -race ./...
      - name: Frontend (typecheck, lint, tests)
        working-directory: frontend
        run: npm run typecheck && npm run lint && npm test
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json') }}
      - name: E2E (Playwright, backend simulado)
        working-directory: frontend
        run: npx playwright install --with-deps chromium && npm run test:e2e
      - name: Bindings sin cambios
        run: |
          wails3 generate bindings -clean=true -ts -i
          if [ -n "$(git status --porcelain -- frontend/bindings)" ]; then
            echo "::error::Los bindings generados difieren de los commiteados. Ejecuta 'wails3 generate bindings -clean=true -ts -i' y commitea."
            git status --short -- frontend/bindings
            exit 1
          fi

  # Contra MySQL 8.0/8.4 y MariaDB 10.11 reales (testcontainers; Docker viene en ubuntu-latest).
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/setup
      - run: go test -tags=integration -count=1 ./...

  # Solo tras pasar los checks y nunca en PR: macOS y Windows son los runners caros.
  build:
    if: github.event_name != 'pull_request'
    needs: [check, integration]
    permissions:
      contents: read
    uses: ./.github/workflows/build.yml
