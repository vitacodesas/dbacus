name: ci
on: [push, pull_request]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod }
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - uses: arduino/setup-task@v2
      - name: Linux deps
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-4-dev libwebkitgtk-6.0-dev
      - name: Instalar wails3 (versión de go.mod)
        shell: bash
        run: |
          V=$(go list -m -f '{{.Version}}' github.com/wailsapp/wails/v3)
          go install github.com/wailsapp/wails/v3/cmd/wails3@$V
      - run: cd frontend && npm ci && npm run typecheck && npm run lint && npm test
      # main.go embebe frontend/dist (ignorado por git): debe existir antes de vet/test/build de Go.
      - run: cd frontend && npm run build
      - name: E2E (Playwright, backend simulado)
        if: runner.os == 'Linux'
        working-directory: frontend
        run: npx playwright install --with-deps chromium && npm run test:e2e
      - run: go vet ./...
      - run: go test -race ./...
      - name: Compilar y empaquetar
        shell: bash
        run: |
          mkdir -p dist-artifacts
          case "$RUNNER_OS" in
            macOS)
              wails3 package
              ditto -c -k --keepParent bin/tabularis-clon.app dist-artifacts/tabularis-clon-macos.zip ;;
            Windows)
              wails3 build
              cp bin/tabularis-clon.exe dist-artifacts/tabularis-clon-windows.exe ;;
            Linux)
              wails3 build
              tar czf dist-artifacts/tabularis-clon-linux.tar.gz -C bin tabularis-clon ;;
          esac
      - uses: actions/upload-artifact@v4
        with:
          name: tabularis-clon-${{ runner.os }}
          path: dist-artifacts/*
          if-no-files-found: error
          retention-days: 14

  # Contra MySQL 8.0/8.4 y MariaDB 10.11 reales (testcontainers; Docker viene en ubuntu-latest).
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod }
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - name: Linux deps
        run: sudo apt-get update && sudo apt-get install -y libgtk-4-dev libwebkitgtk-6.0-dev
      - run: cd frontend && npm ci && npm run build
      - run: go test -tags=integration -count=1 ./...

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod }
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - name: Linux deps
        run: sudo apt-get update && sudo apt-get install -y libgtk-4-dev libwebkitgtk-6.0-dev
      - run: cd frontend && npm ci && npm run build
      - run: go install golang.org/x/vuln/cmd/govulncheck@latest && govulncheck ./...
      - run: cd frontend && npm audit --audit-level=high
