name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with: { fetch-depth: 0 }
      - name: La etiqueta coincide con la versión de build/config.yml
        run: |
          CFG=$(awk '/^info:/{i=1} i && /^  version:/{gsub(/"/,"",$2); print $2; exit}' build/config.yml)
          TAG="${GITHUB_REF_NAME#v}"
          # Una etiqueta de prerelease (v0.2.0-rc.1) se compara por su parte numérica.
          if [ "${TAG%%-*}" != "$CFG" ]; then
            echo "::error::La etiqueta $GITHUB_REF_NAME no coincide con la versión $CFG de build/config.yml"
            exit 1
          fi
      - name: La etiqueta apunta a un commit de main
        run: |
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main \
            || { echo "::error::El commit etiquetado no está en main"; exit 1; }

  build:
    needs: verify
    permissions:
      contents: read
    uses: ./.github/workflows/build.yml

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write # único job que escribe: crea la release
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: dbacus-*
          merge-multiple: true
          path: release
      - name: Nombres con versión y SHA256SUMS
        working-directory: release
        run: |
          V="$GITHUB_REF_NAME"
          for f in dbacus-*; do mv "$f" "dbacus-$V-${f#dbacus-}"; done
          sha256sum dbacus-* > SHA256SUMS
          cat SHA256SUMS
      - name: Notas de la versión
        run: |
          V="${GITHUB_REF_NAME#v}"
          # Sección "## [X.Y.Z]" o "## X.Y.Z" del CHANGELOG; si no existe se generan desde los commits.
          if [ -f CHANGELOG.md ]; then
            awk -v v="$V" '$0 ~ "^## \\[?"v"\\]?" {f=1; next} /^## / {f=0} f' CHANGELOG.md > notes.md
          fi
          if [ -s notes.md ]; then echo "NOTES=--notes-file notes.md" >> "$GITHUB_ENV"; else echo "NOTES=--generate-notes" >> "$GITHUB_ENV"; fi
      - name: Crear la release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PRE=""; case "$GITHUB_REF_NAME" in *-*) PRE="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" release/* --title "Dbacus $GITHUB_REF_NAME" --verify-tag $PRE $NOTES
