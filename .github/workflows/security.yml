name: security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1" # lunes: aparecen avisos nuevos aunque no haya commits
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      any: ${{ steps.c.outputs.any }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with: { fetch-depth: 0 }
      - id: c
        uses: ./.github/actions/changes

  # La ejecución semanal y la manual siempre auditan (sin base comparable, `changes` lo da todo por cambiado):
  # aparecen avisos nuevos aunque el código no cambie.
  audit:
    needs: changes
    if: needs.changes.outputs.any == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/setup
      - run: go mod verify
      # govulncheck solo falla por vulnerabilidades alcanzables desde el código.
      - run: go install golang.org/x/vuln/cmd/govulncheck@latest && govulncheck ./...
      - run: cd frontend && npm audit --audit-level=high

  # Necesita el grafo de dependencias: en repos privados exige GitHub Advanced Security, así que solo en públicos.
  dependency-review:
    if: github.event_name == 'pull_request' && !github.event.repository.private
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4.9.0
        with: { fail-on-severity: high }
