name: setup
description: Go, Node, dependencias del sistema y (opcional) wails3 y frontend/dist

inputs:
  wails:
    description: Instalar wails3 con la versión exacta de go.mod
    default: "false"
  frontend:
    description: "build = npm ci + npm run build (main.go embebe frontend/dist, ignorado por git); install = solo npm ci; none = nada"
    default: build

runs:
  using: composite
  steps:
    - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
      with: { go-version-file: go.mod }
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
      with: { node-version: 24, cache: npm, cache-dependency-path: frontend/package-lock.json }
    # Wails 3.0.0 usa GTK4 + WebKitGTK 6.0 por defecto en Linux (GTK3 solo con -tags gtk3).
    - name: Dependencias de Linux
      if: runner.os == 'Linux'
      shell: bash
      run: sudo apt-get update && sudo apt-get install -y libgtk-4-dev libwebkitgtk-6.0-dev
    # wails3 trae su propio ejecutor de Task: no hace falta instalar `task` (y su instalador consulta la API de GitHub
    # sin autenticar, que en los runners compartidos acaba en "API rate limit exceeded").
    - name: Instalar wails3 (versión de go.mod)
      if: inputs.wails == 'true'
      shell: bash
      run: |
        V=$(go list -m -f '{{.Version}}' github.com/wailsapp/wails/v3)
        go install "github.com/wailsapp/wails/v3/cmd/wails3@$V"
    - name: Frontend
      if: inputs.frontend != 'none'
      shell: bash
      working-directory: frontend
      run: |
        npm ci
        if [ "${{ inputs.frontend }}" = "build" ]; then npm run build; fi
